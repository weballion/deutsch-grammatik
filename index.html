 '<p>Незакінчений тест зберігається: його можна продовжити з головної. «Скасувати тест» скидає його без збереження результату.</p></div>'+
 '<div class="frame inf"><h3 style="margin-top:0">Звідки завдання</h3><p>Усі завдання — з готового банку: '+n+' завдань'+(LEVEL=='a2b2'?', близько 100 на кожен блок, у блоці M — фіксований список дієслів із прийменниками з підручника ('+DATA.tasks.filter(function(t){return t.block=='M'}).length+')':' для рівня A1–A2 (6 спрощених блоків)')+'.</p></div>'+
 '<div class="frame inf"><h3 style="margin-top:0">Рівень</h3><p>У налаштуваннях можна вибрати рівень A2–B2 (усі 13 блоків) або A1–A2 (6 спрощених блоків із простішими завданнями, без складних тем, як Passiv, Konjunktiv II чи Relativsätze). Це два різні банки завдань: прогрес, помилки і вибір блоків зберігаються окремо для кожного рівня.</p></div>'+
 '<div class="frame inf"><h3 style="margin-top:0">Перевірка і бали</h3><p>Правильно — 1 бал, майже правильно — 0,5, неправильно — 0. Регістр і розділові знаки не враховуються, крім блоку K «Правопис».</p>'+
 '<p>Вибір відповіді, вставка слова і складання речення перевіряються за зразком одразу. Переклад, виправлення і перетворення: при точному збігу — одразу; інакше ви порівнюєте свою відповідь із зразком самі й обираєте «Правильно», «Майже» або «Неправильно».</p>'+
 '<p>«Показати результат наприкінці» приховує оцінку після кожної відповіді; підсумок і аналіз помилок завжди показуються в кінці тесту.</p></div>'+
 '<div class="frame inf"><h3 style="margin-top:0">Помилки і прогрес</h3><p>«Де більше помилок» показує відсоток балів за кожним блоком за останні 3 проходження, найгірші блоки зверху (не більше 10). Блок нижче 70% вважається слабким і підсвічується червоним.</p>'+
 '<p>«Робота над помилками» збирає тест із завдань, де ви помилилися, спочатку в слабких блоках, і добирає завдання з цих же блоків. Завдання йде зі списку помилок, коли ви відповісте на нього правильно.</p></div>'+
 '<div class="frame inf"><h3 style="margin-top:0">Інше</h3><p>Кнопки ä ö ü ß під полем введення включаються в налаштуваннях. Налаштування і прогрес зберігаються автоматично в хмарі Telegram (Cloud Storage), на цьому ж акаунті вони доступні з будь-якого пристрою.</p>'+
 '<p>Дизайн у налаштуваннях — «Темна» або «Світла»: змінюється лише оформлення (кольори, скруглення, тіні, розмитий фон), логіка і екрани ті самі. «Темна» підлаштовується під тему телефону (світла чи темна), «Світла» завжди світла, не залежить від теми телефону.</p>'+
 '<p class="mut">Опис оновлено: 17.11.2026.</p></div><button class="pri" id="bk2">Зрозуміло</button>';
 render(h);window.scrollTo(0,0);document.getElementById('bk').onclick=home;document.getElementById('bk2').onclick=home;
}
function cntB(k){return Math.min(S.diff,bank(k).length)}
function total(){var n=0;S.blocks.forEach(function(k){n+=cntB(k)});return n}
function upd(){var sm=document.getElementById('sm');if(!sm)return;sm.textContent='Граматичні блоки: вибрано '+S.blocks.length+' з '+Object.keys(DATA.blocks).length;
 Object.keys(DATA.blocks).forEach(function(k){var e=document.getElementById('ts'+k);if(!e)return;var p=plan(k,S.diff),w=tw(k);
  e.textContent='Типи завдань: '+Object.keys(w).filter(function(t){return w[t]>0}).map(function(t){return TSH[t]+' '+(p[t]||0)}).join(', ')+' · у банку: '+bank(k).length;
  Object.keys(w).forEach(function(t){var tv=document.getElementById('tv'+k+t);if(tv)tv.textContent=(p[t]||0)+' з '+S.diff})});
 document.getElementById('cnt').textContent='Усього в тесті: '+total()+' завдань.'}
function start(){
 var pool=[],skip={},warn=[];
 S.blocks.forEach(function(k){var n=S.diff,bk=bank(k),p=plan(k,n),got=[];
  Object.keys(p).forEach(function(t){got=got.concat(pick(bk.filter(function(x){return x.type==t}),p[t],skip))});
  got=got.concat(pick(bk,Math.min(n,bk.length)-got.length,skip));
  if(got.length<Math.min(n,bk.length))warn.push('Блок '+k+': у банку менше завдань, ніж потрібно.');
  pool=pool.concat(got)});
 if(!pool.length){home();document.getElementById('wmsg').textContent=warn.join(' ')||'Для вибраних блоків немає завдань. Виберіть блоки в налаштуваннях.';return}
 run={q:shuffle(pool),i:0,res:[],warn:warn.join(' ')};save();show();
}
function score(){return run.res.reduce(function(a,r){return a+r.s},0)}
function buildInit(t){
 var toks=shuffle(t.text.split(' / ').map(function(w,i){return{w:w.trim(),i:i}})),placed=[];
 function draw(){
  var bl=document.getElementById('bl'),bp=document.getElementById('bp');if(!bl)return;
  bl.innerHTML=placed.length?'':'<span class="mut">Ваше речення</span>';
  placed.forEach(function(k){var b=document.createElement('button');b.className='chip on';b.textContent=k.w;b.onclick=function(){if(bl.dataset.lock)return;placed.splice(placed.indexOf(k),1);draw()};bl.appendChild(b)});
  bp.innerHTML='';
  toks.forEach(function(k){var b=document.createElement('button');b.className='chip';b.textContent=k.w;if(placed.indexOf(k)>=0){b.disabled=true;b.style.opacity='.35'}b.onclick=function(){if(bl.dataset.lock)return;placed.push(k);draw();document.getElementById('be').textContent=''};bp.appendChild(b)})}
 draw();
 document.getElementById('rs').onclick=function(){if(document.getElementById('bl').dataset.lock)return;placed=[];draw()};
 document.getElementById('chk').onclick=function(){if(placed.length<toks.length){document.getElementById('be').textContent='Використовуйте всі слова.';return}
  document.getElementById('bl').dataset.lock=1;document.getElementById('rs').disabled=true;answer(placed.map(function(k){return k.w}).join(' '))}}
function bindCancel(){var w=document.getElementById('cxw');
 function ask(){w.innerHTML='<div class="cx"><span>Скасувати тест? Результат не збережеться.</span><button id="cxy">Так</button><button id="cxn">Ні</button></div>';
  document.getElementById('cxy').onclick=function(){run=null;saved=null;save();home()};
  document.getElementById('cxn').onclick=function(){w.innerHTML='<button class="lnk" id="cx">Скасувати тест</button>';document.getElementById('cx').onclick=ask}}
 document.getElementById('cx').onclick=ask}
var icCopy='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
function capFirst(el){if(!el.value)return;var c=el.value.charAt(0),u=c.toUpperCase();if(c===u)return;
 var a=el.selectionStart,z=el.selectionEnd;el.value=u+el.value.slice(1);try{el.selectionStart=a;el.selectionEnd=z}catch(e){}}
function umRow(){return UM?'<div class="um">'+['ä','ö','ü','ß'].map(function(c){return '<button type="button" data-c="'+c+'">'+c+'</button>'}).join('')+'</div>':''}
function umBind(el){document.querySelectorAll('.um button').forEach(function(b){b.onmousedown=function(e){e.preventDefault()};b.onclick=function(){var c=b.dataset.c,a=el.selectionStart,z=el.selectionEnd;el.value=el.value.slice(0,a)+c+el.value.slice(z);el.focus();el.selectionStart=el.selectionEnd=a+1}})}
function show(){setView('quiz');
 var t=run.q[run.i];
 var h='<div class="qtop">'+robotHtml('think','rbot-sm')+'<div id="cxw"><button class="lnk" id="cx">Скасувати тест</button></div></div><div class="frame"><div class="top"><span>Запитання '+(run.i+1)+' з '+run.q.length+'</span><span>'+(S.defer?'':'Бали: '+fmt(score()))+'</span></div><div class="bar"><i style="width:'+(run.i/run.q.length*100)+'%"></i></div>';
 var typeLbl=TYPE[t.type].charAt(0).toLowerCase()+TYPE[t.type].slice(1);
 h+='<div class="blk">Блок '+t.block+' · '+esc(DATA.blocks[t.block].name)+' · '+typeLbl+'</div>'+(run.warn&&run.i==0?'<div class="note" style="margin:0 0 10px">'+esc(run.warn)+'</div>':'')+'<div class="q">'+esc(t.prompt)+(t.type=='choice'||t.type=='fill'?'\n'+esc(t.text):'')+'</div>';
 if(t.note)h+='<div class="note">Частина мови: '+esc(t.note)+'</div>';
 if(t.type=='choice'){shuffle(t.options).forEach(function(o){h+='<button class="opt" data-v="'+esc(o)+'">'+esc(o)+'</button>'})}
 else if(t.type=='fill'){h+='<input type="text" id="in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Ваша відповідь">'+umRow()+'<button class="pri" id="chk">Перевірити</button>'}
 else if(t.type=='build'){h+='<div class="note" style="margin-top:-6px">Натискайте слова по порядку, щоб скласти речення. Натисніть на слово в рядку, щоб прибрати його.</div><div id="bl" class="bl"></div><div id="bp" class="bp"></div><div class="rw"><button id="rs">Скинути</button></div><div id="be" class="mut" style="color:var(--bad);min-height:18px"></div><button class="pri" id="chk">Перевірити</button>'}
 else{
  if(t.type!='fix')h+='<div class="q" style="font-size:16px;color:var(--tx2)">'+esc(t.text)+(t.type=='combine'?' <button type="button" id="cp" class="cpy" aria-label="Вставити текст у поле відповіді" title="Вставити в поле відповіді">'+icCopy+'</button>':'')+'</div>';
  h+='<textarea id="in" rows="3" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Ваша відповідь">'+(t.type=='fix'?esc(t.text):'')+'</textarea>'+umRow()+'<button class="pri" id="chk">Перевірити</button>'}
 h+='<div id="fb"></div></div>';render(h);
 bindCancel();
 tgBack(function(){var c=document.getElementById('cx');if(c)c.click()});
 if(t.type=='choice')document.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){answer(b.dataset.v,b)}});
 else if(t.type=='build'){buildInit(t)}
 else{var el=document.getElementById('in');el.focus();umBind(el);document.getElementById('chk').onclick=function(){var v=el.value.trim();if(!v){el.style.borderColor='var(--bad)';return}answer(v)};
  if(t.type=='fill')el.onkeydown=function(e){if(e.key=='Enter')document.getElementById('chk').click()};
  else if(t.type=='translate'||t.type=='combine')el.oninput=function(){capFirst(el)};
  var cp=document.getElementById('cp');if(cp)cp.onclick=function(){el.value=t.text;capFirst(el);el.focus();el.selectionStart=el.selectionEnd=el.value.length}}
}
function grade(t,v){
 var st=DATA.blocks[t.block].strict,sq=function(x){return x.trim().replace(/\s+/g,' ')};var exact=t.answers.some(function(a){return st?sq(a)==sq(v):norm(a)==norm(v)});
 if(exact)return{s:1};
 if(!FREE[t.type])return{s:0};
 return{s:0,self:1};
}
function answer(v,btn){
 haptic();
 var t=run.q[run.i];
 if(btn){document.querySelectorAll('.opt').forEach(function(b){b.disabled=true})}else{document.getElementById('chk').disabled=true;var inp=document.getElementById('in');if(inp)inp.disabled=true}
 var g=grade(t,v);var rec={t:t,v:v,s:g.s};run.res.push(rec);run.i++;var last=run.i>=run.q.length;save();run.i--;
 if(g.self){selfAsk(t,v,rec,last);return}
 if(S.defer){next();return}
 if(t.type=='choice'){document.querySelectorAll('.opt').forEach(function(b){if(norm(b.dataset.v)==norm(t.answers[0]))b.classList.add('ok');else if(b===btn&&g.s==0)b.classList.add('bad')})}
 else{document.getElementById('chk').style.display='none'}
 var cls=g.s==1?'ok':g.s==0.5?'half':'bad';
 setMood(g.s>0?'happy':'sad');
 var f='<div class="fb '+cls+'"><b>'+(g.s==1?'Правильно.':g.s==0.5?'Майже: половина бала.':'Неправильно.')+'</b>';
 if(g.s<1)f+=' Еталон: '+esc(t.answers[0]);
 f+='<div class="h">'+esc(t.hint)+'</div>';
 f+='</div><button class="pri" id="nx">'+(last?'Результат':'Далі')+'</button>';
 document.getElementById('fb').innerHTML=f;
 document.getElementById('nx').onclick=next;
}
function selfAsk(t,v,rec,last){document.getElementById('chk').style.display='none';
 var f='<div class="fb half" id="sfb"><b>Порівняйте з еталоном.</b><div class="h">Ваша відповідь: '+esc(v)+'</div><div class="h">Еталон: '+t.answers.map(esc).join('<br>або: ')+'</div><div class="sa"><button data-s="1">Правильно</button><button data-s="0.5">Майже</button><button data-s="0">Неправильно</button></div></div>';
 document.getElementById('fb').innerHTML=f;
 document.querySelectorAll('.sa button').forEach(function(b){b.onclick=function(){haptic();rec.s=+b.dataset.s;run.i++;save();run.i--;
  if(S.defer){next();return}
  setMood(rec.s>0?'happy':'sad');
  var x=document.getElementById('sfb');x.className='fb '+(rec.s==1?'ok':rec.s==0.5?'half':'bad');
  x.innerHTML='<b>'+(rec.s==1?'Зараховано.':rec.s==0.5?'Половина бала.':'Не зараховано.')+'</b> Еталон: '+esc(t.answers[0])+'<div class="h">'+esc(t.hint)+'</div>';
  var nb=document.createElement('button');nb.className='pri';nb.textContent=last?'Результат':'Далі';nb.onclick=next;document.getElementById('fb').appendChild(nb)}})}
function next(){run.i++;if(run.i<run.q.length){save();show()}else finish()}
function finish(){setView('result');tgBack(home);
 recordProgress();var sc=score(),h='<div class="frame"><small>Результат</small><div class="big">'+fmt(sc)+' з '+run.res.length+'</div><small>За блоками</small>';
 Object.keys(DATA.blocks).forEach(function(k){var r=run.res.filter(function(x){return x.t.block==k});if(r.length)h+='<div class="row"><span>'+k+' '+DATA.blocks[k].name+'</span><span>'+fmt(r.reduce(function(a,x){return a+x.s},0))+' з '+r.length+'</span></div>'});
 h+='</div>';
 var bad=run.res.filter(function(r){return r.s<1});
 if(bad.length){h+='<p><small>Аналіз помилок ('+bad.length+')</small></p>';bad.forEach(function(r){h+='<div class="err"><div class="mut">'+TYPE[r.t.type]+' · блок '+r.t.block+' · '+fmt(r.s)+(r.s==0?' балів':' бала')+'</div>'+esc(r.t.prompt)+' '+esc(r.t.text)+'<br>Ваша відповідь: '+esc(r.v)+'<br>Еталон: '+esc(r.t.answers[0])+'<div class="mut" style="margin-top:4px">'+esc(r.t.hint)+'</div></div>'})}
 else h+='<div class="frame"><p style="margin:0">Помилок немає.</p></div>';
 var hasW=weak().length||errTasks().length;h+=(hasW?'<button class="pri" id="wk2">Робота над помилками</button>':'')+'<button class="'+(hasW?'sec':'pri')+'" id="again">Пройти ще раз</button><button class="sec" id="home">На головну</button>';
 render(h);run.done=true;var keep=run;run=null;saved=null;save();run=keep;
 document.getElementById('again').onclick=start;var w2=document.getElementById('wk2');if(w2)w2.onclick=startWeak;document.getElementById('home').onclick=function(){run=null;home()};
}
document.body.className='home';render(loaderHtml());
csGet(['dg_uml','dg_theme','dg_level'],function(res){
 UM=res.dg_uml=='1';
 setTheme(['lavender','liquid'].indexOf(res.dg_theme)>=0?res.dg_theme:'classic');
 loadLevel(res.dg_level=='a1a2'?'a1a2':'a2b2',init);
});
