<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deutsch: Грамматика</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf9f5">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1b19">
<style>
:root{--bg:#faf9f5;--card:#fff;--tx:#1f1e1d;--tx2:#6b6a66;--bd:#e3e1d8;--pri:#1f1e1d;--onpri:#fff;--ok:#2e7d32;--okbg:#e8f3e8;--bad:#b3261e;--badbg:#fbe9e7}
@media(prefers-color-scheme:dark){:root{--bg:#1c1b19;--card:#262522;--tx:#f0eee6;--tx2:#a8a69e;--bd:#3a3834;--pri:#f0eee6;--onpri:#1c1b19;--ok:#7bc47f;--okbg:#22331f;--bad:#f2867d;--badbg:#3a2220}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:24px;margin:2px 0 18px;font-weight:600}small,.mut{color:var(--tx2);font-size:13px}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:11px 14px;cursor:pointer}
button.pri{background:var(--pri);color:var(--onpri);border-color:var(--pri);font-weight:600;width:100%;height:48px;margin-top:10px}
button.sec{width:100%;height:46px;margin-top:8px}
.seg{display:flex;gap:6px}.seg button{flex:1}.seg button.on{border-color:var(--tx);font-weight:600}
details{border:1px solid var(--bd);border-radius:10px;padding:10px 12px;background:var(--card);margin:14px 0}summary{cursor:pointer}
.grid{display:grid;grid-template-columns:1fr;gap:8px 10px;margin-top:10px;font-size:14px}
label{display:flex;gap:8px;align-items:center}input[type=checkbox]{width:18px;height:18px}
.top{display:flex;justify-content:space-between;font-size:13px;color:var(--tx2)}
.bar{height:5px;background:var(--bd);border-radius:3px;margin:8px 0 16px}.bar i{display:block;height:100%;background:var(--pri);border-radius:3px;transition:width .2s}
.tag{font-size:12px;color:var(--tx2);margin-bottom:4px}.q{font-size:18px;margin:6px 0 14px;white-space:pre-wrap}
.opt{display:block;width:100%;text-align:left;margin-bottom:8px}.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}
input[type=text],textarea{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:11px}
.fb{margin-top:14px;padding:12px;border-radius:10px;font-size:15px}.fb.ok{background:var(--okbg);color:var(--ok)}.fb.bad{background:var(--badbg);color:var(--bad)}
.fb .h{color:var(--tx);font-size:14px;margin-top:6px}.fb a{color:var(--tx);text-decoration:underline;cursor:pointer;font-size:14px;display:inline-block;margin-top:8px}
.big{font-size:36px;font-weight:700;margin:4px 0 12px}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd);font-size:15px}
.blk{font-size:15px;font-weight:600;margin:0 0 2px}.note{font-size:13px;color:var(--tx2);margin:-8px 0 12px}.fb.half{background:#fff4d6;color:#7a5b00}@media(prefers-color-scheme:dark){.fb.half{background:#3a3217;color:#e8c766}}.bl{min-height:56px;border:1.5px dashed var(--bd);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}.bp{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.chip{padding:8px 12px}.chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}.rw{text-align:right;margin-bottom:4px}.rw button{padding:6px 10px;font-size:13px}.lnk{background:none;border:none;color:var(--tx2);font-size:13px;text-decoration:underline;padding:4px 0}.cx{display:flex;gap:8px;align-items:center;justify-content:flex-end;font-size:13px}.cx button{padding:6px 10px;font-size:13px}.bi{border-bottom:1px solid var(--bd);padding-bottom:8px}.bi:last-child{border:none}.ty{margin:6px 0 0 26px;padding:6px 10px;font-size:13px}.ty summary{color:var(--tx2)}.tyf{margin:4px 0 0 26px;font-size:12px;color:var(--tx2)}.tr{display:flex;justify-content:space-between;align-items:center;padding:4px 0}.st{display:flex;align-items:center;gap:10px}.st button{padding:2px 12px;font-size:16px}.st b{min-width:18px;text-align:center}.ld{width:30%!important;animation:ld 1.2s ease-in-out infinite alternate}@keyframes ld{from{margin-left:0}to{margin-left:70%}}.hd{display:flex;justify-content:space-between;align-items:flex-end}.ic{display:flex;gap:8px}.ic button{width:42px;height:42px;padding:0;font-size:20px;border-radius:50%}.big2{height:60px;font-size:20px}.sum{display:block;width:100%;text-align:center;margin:6px 0 10px}.inf h3{font-size:16px;margin:18px 0 4px}.inf p,.inf li{font-size:15px;margin:4px 0}.inf ul{padding-left:20px;margin:4px 0}.sa{display:flex;gap:8px;margin-top:10px}.sa button{flex:1}.um{display:flex;gap:6px;margin:8px 0 0}.um button{flex:1;padding:8px 0;font-size:17px}.err{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px}
</style></head><body><main id="app"></main>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
var TYPE={choice:"Выбор ответа",fill:"Вставить слово",fix:"Исправить ошибку",translate:"Перевод RU → DE",build:"Составить предложение",combine:"Объединить / преобразовать"};
var FREE={fix:1,translate:1,build:1,combine:1};
var TSH={choice:'выбор',fill:'вставить',fix:'исправить',translate:'перевод',build:'составить',combine:'объединить'};
var app=document.getElementById('app');
var DATA=null,byId={},S=null,run=null,saved=null,P={},UM=false,VIEW='home';
var TG=window.Telegram&&window.Telegram.WebApp;
if(TG){try{TG.ready();TG.expand()}catch(e){}}
var CS=TG&&TG.CloudStorage;
function csSet(key,val){if(CS){try{CS.setItem(key,val,function(){})}catch(e){}return}try{localStorage.setItem(key,val)}catch(e){}}
function csGet(keys,cb){
 if(CS){try{CS.getItems(keys,function(err,res){cb(err?{}:res||{})});return}catch(e){}cb({});return}
 var o={};keys.forEach(function(k){try{var v=localStorage.getItem(k);if(v!=null)o[k]=v}catch(e){}});cb(o)}
function haptic(){if(TG&&TG.HapticFeedback)try{TG.HapticFeedback.impactOccurred('light')}catch(e){}}
function tgBack(fn){if(!TG||!TG.BackButton)return;if(tgBack._fn)TG.BackButton.offClick(tgBack._fn);tgBack._fn=fn||null;if(fn){TG.BackButton.onClick(fn);TG.BackButton.show()}else TG.BackButton.hide()}
function applyTheme(){if(!TG)return;var p=TG.themeParams||{},map={bg_color:'--bg',secondary_bg_color:'--card',text_color:'--tx',hint_color:'--tx2',section_separator_color:'--bd',button_color:'--pri',button_text_color:'--onpri'};
 Object.keys(map).forEach(function(k){if(p[k])document.documentElement.style.setProperty(map[k],'#'+String(p[k]).replace('#',''))})}
applyTheme();
if(TG&&TG.onEvent)TG.onEvent('themeChanged',applyTheme);
function saveSet(){csSet('dg_set',JSON.stringify({diff:S.diff,defer:S.defer,blocks:S.blocks,types:S.types}))}
function bank(k){return DATA.tasks.filter(function(t){return t.block==k})}
function allTasks(){return DATA.tasks}
function tw(k){var d=DATA.blocks[k].types,u=S.types[k]||{},o={};Object.keys(d).forEach(function(t){o[t]=u[t]!=null?u[t]:d[t]});return o}
function plan(k,n){var w=tw(k),ks=Object.keys(w).filter(function(t){return w[t]>0}),sum=ks.reduce(function(a,t){return a+w[t]},0),o={};if(!sum)return o;var r=[],used=0;
 ks.forEach(function(t){var x=n*w[t]/sum;o[t]=Math.floor(x);used+=o[t];r.push([x-o[t],t])});r.sort(function(a,b){return b[0]-a[0]});for(var i=0;used<n;i++,used++)o[r[i%r.length][1]]++;return o}
function fixedB(k){return !!DATA.blocks[k].fixed}
function pick(list,n,skip){var sn=P.seen||{};list=shuffle(list.filter(function(t){return !skip[t.id]})).sort(function(a,b){return(sn[a.id]||0)-(sn[b.id]||0)});list=list.slice(0,n);list.forEach(function(t){skip[t.id]=1});return list}
function norm(s){return s.toLowerCase().replace(/[.,!?;:"«»„“”]/g,' ').replace(/\s+/g,' ').trim()}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function fmt(x){return String(x).replace('.',',')}
function save(){var p=run?{S:S,ids:run.q.map(function(t){return t.id}),i:run.i,res:run.res.map(function(r){return{id:r.t.id,v:r.v,s:r.s,c:r.c}})}:null;
 csSet('dg_run',p?JSON.stringify(p):'')}
function restore(p){S=p.S;run={q:p.ids.map(function(i){return byId[i]}),i:p.i,res:p.res.map(function(r){return{t:byId[r.id],v:r.v,s:r.s,c:r.c}})};}
function parseSaved(x){try{var p=typeof x=='string'?JSON.parse(x):x;if(p&&p.ids&&p.i<p.ids.length&&p.ids.every(function(i){return byId[i]}))return p}catch(e){}return null}
function saveP(){var keys=Object.keys(DATA.blocks);
 keys.forEach(function(k){csSet('dg_prog_'+k,JSON.stringify(P[k]||{last:[],errs:[]}));
  var sn={};Object.keys(P.seen||{}).forEach(function(id){if(id.charAt(0)==k)sn[id]=P.seen[id]});
  csSet('dg_seen_'+k,JSON.stringify(sn))})}
function pstat(k){var b=P[k];if(!b||!b.last||!b.last.length)return null;var s=0,n=0;b.last.forEach(function(x){s+=x.s;n+=x.n});return n?s/n:null}
function weak(){return Object.keys(DATA.blocks).filter(function(k){var p=pstat(k);return p!==null&&p<0.7})}
function errTasks(keys){var o=[];Object.keys(P).forEach(function(k){if(keys&&keys.indexOf(k)<0)return;(P[k].errs||[]).forEach(function(id){if(byId[id])o.push(byId[id])})});return o}
function recordProgress(){var by={};run.res.forEach(function(r){var k=r.t.block;by[k]=by[k]||{s:0,n:0};by[k].s+=r.s;by[k].n++});
 Object.keys(by).forEach(function(k){P[k]=P[k]||{last:[],errs:[]};P[k].last.push(by[k]);P[k].last=P[k].last.slice(-3)});
 P.seen=P.seen||{};run.res.forEach(function(r){P.seen[r.t.id]=(P.seen[r.t.id]||0)+1;var b=P[r.t.block],i=b.errs.indexOf(r.t.id);if(r.s<1){if(i<0)b.errs.push(r.t.id)}else if(i>=0)b.errs.splice(i,1)});saveP()}
function startWeak(){var wk=weak(),pool=errTasks(wk.length?wk:null),seen={};pool.forEach(function(t){seen[t.id]=1});pool=shuffle(pool);
 if(wk.length)pool=pool.concat(shuffle(allTasks().filter(function(t){return wk.indexOf(t.block)>=0&&!seen[t.id]})));
 pool=pool.slice(0,S.diff);if(!pool.length)return false;run={q:shuffle(pool),i:0,res:[]};save();show();return true}
function loadP(cb){var keys=Object.keys(DATA.blocks),want=[];
 keys.forEach(function(k){want.push('dg_prog_'+k,'dg_seen_'+k)});
 csGet(want,function(res){var p={seen:{}};
  keys.forEach(function(k){
   try{var pr=JSON.parse(res['dg_prog_'+k]||'null');if(pr)p[k]=pr}catch(e){}
   try{var sn=JSON.parse(res['dg_seen_'+k]||'null');if(sn)Object.keys(sn).forEach(function(id){p.seen[id]=sn[id]})}catch(e){}
  });
  P=p;cb()})}
function loadAll(cb){
 csGet(['dg_set','dg_uml','dg_run'],function(res){
  try{var _s=JSON.parse(res.dg_set||'null');if(_s){Object.keys(_s).forEach(function(k){S[k]=_s[k]});S.blocks=S.blocks.filter(function(k){return DATA.blocks[k]})}}catch(e){}
  UM=res.dg_uml=='1';
  try{if(res.dg_run)saved=parseSaved(res.dg_run)}catch(e){}
  loadP(cb)})}
function init(){home()}
function sumLine(){var n=S.blocks.length,d={5:'Легко',10:'Средне',15:'Сложно'}[S.diff];return (n==Object.keys(DATA.blocks).length?'Все блоки ('+n+')':'Блоков: '+n+' ('+S.blocks.join(', ')+')')+' · '+d+' · '+total()+' заданий'}
function home(){VIEW='home';tgBack(null);
 var h='<div class="hd"><div><small>Deutsch</small><h1 style="margin-bottom:0">Грамматика</h1></div><div class="ic"><button id="inf" aria-label="Как это работает">ⓘ</button><button id="set" aria-label="Настройки">⚙</button></div></div><div style="height:18px"></div>';
 if(saved)h+='<button class="sec" id="resume" style="margin:0 0 4px">Продолжить тест (вопрос '+(saved.i+1)+' из '+saved.ids.length+')</button>';
 h+='<button class="pri big2" id="go">Старт</button><button class="lnk sum" id="sum">'+esc(sumLine())+'</button>';
 h+='<button class="sec" id="weak">Работа над ошибками</button><p class="mut" id="wmsg" style="margin:6px 0 0"></p>';
 var st=Object.keys(DATA.blocks).filter(function(k){return pstat(k)!==null}).sort(function(a,b){return pstat(a)-pstat(b)});
 if(st.length){h+='<p style="margin:18px 0 4px"><small>Где больше ошибок (последние 3 прохождения)</small></p>';st.forEach(function(k){var p=Math.round(pstat(k)*100);h+='<div class="row"><span>'+k+' '+esc(DATA.blocks[k].name)+'</span><span style="'+(p<70?'color:var(--bad);font-weight:600':'')+'">'+p+'%</span></div>'});h+='<p class="mut" style="margin-top:6px">Слабый блок: ниже 70%.</p>'}
 app.innerHTML=h;
 var r=document.getElementById('resume');if(r)r.onclick=function(){restore(saved);show()};
 document.getElementById('set').onclick=settings;document.getElementById('sum').onclick=settings;document.getElementById('inf').onclick=info;
 document.getElementById('weak').onclick=function(){if(!startWeak())document.getElementById('wmsg').textContent='Пока ошибок нет: задания с ошибками появятся здесь после первых тестов.'};
 document.getElementById('go').onclick=function(){if(!S.blocks.length){settings();return}start()};
}
function settings(){VIEW='set';tgBack(home);
 var h='<button class="lnk" id="bk">← Назад</button><h1 style="margin-top:6px">Настройки</h1>';
 h+='<small>Сложность (заданий на каждый блок)</small><div class="seg" id="seg" style="margin-top:6px">';
 [['Легко',5],['Средне',10],['Сложно',15]].forEach(function(d){h+='<button data-n="'+d[1]+'" class="'+(S.diff==d[1]?'on':'')+'">'+d[0]+' · '+d[1]+'</button>'});
 h+='</div><p class="mut" style="margin:6px 0 14px" id="cnt"></p>';
 h+='<label><input type="checkbox" id="defer" '+(S.defer?'checked':'')+'> Показать результат в конце</label>';
 h+='<label style="margin-top:8px"><input type="checkbox" id="uml" '+(UM?'checked':'')+'> Кнопки ä ö ü ß под полем ввода</label>';
 h+='<div class="hd" style="margin:20px 0 6px"><small id="sm"></small><span><button class="lnk" id="all">Все</button> · <button class="lnk" id="none">Снять</button></span></div><div class="grid" style="margin-top:0">';
 Object.keys(DATA.blocks).forEach(function(k){var b=DATA.blocks[k];
  h+='<div class="bi"><label style="align-items:flex-start"><input type="checkbox" class="blk" value="'+k+'" '+(S.blocks.indexOf(k)>=0?'checked':'')+' style="margin-top:3px"><span>'+k+' '+b.name+' <small>'+b.level+'</small>'+(b.example?'<br><small style="font-size:12px">'+esc(b.example)+'</small>':'')+'</span></label>';
  if(fixedB(k))h+='<div class="tyf">Только выбор ответа, фиксированный список ('+bank(k).length+')</div>';
  else{h+='<details class="ty"><summary id="ts'+k+'"></summary>';Object.keys(b.types).forEach(function(t){h+='<div class="tr"><span>'+TYPE[t]+'</span><span class="st"><button data-k="'+k+'" data-t="'+t+'" data-d="-1">−</button><b id="tv'+k+t+'">'+tw(k)[t]+'</b><button data-k="'+k+'" data-t="'+t+'" data-d="1">+</button></span></div>'});
   h+='<div class="tr"><button class="lnk" data-rk="'+k+'">Сбросить к стандарту</button></div></details>'}
  h+='</div>'});
 h+='</div><button class="pri" id="bk2">Готово</button>';
 app.innerHTML=h;upd();window.scrollTo(0,0);
 document.getElementById('bk').onclick=home;document.getElementById('bk2').onclick=home;
 document.querySelectorAll('#seg button').forEach(function(b){b.onclick=function(){S.diff=+b.dataset.n;saveSet();document.querySelectorAll('#seg button').forEach(function(x){x.className=x===b?'on':''});upd()}});
 document.getElementById('defer').onchange=function(e){S.defer=e.target.checked;saveSet()};
 document.getElementById('uml').onchange=function(e){UM=e.target.checked;csSet('dg_uml',UM?'1':'0')};
 function selB(){S.blocks=[].slice.call(document.querySelectorAll('.blk')).filter(function(x){return x.checked}).map(function(x){return x.value});saveSet();upd()}
 document.querySelectorAll('.blk').forEach(function(c){c.onchange=selB});
 document.getElementById('all').onclick=function(){document.querySelectorAll('.blk').forEach(function(c){c.checked=true});selB()};
 document.getElementById('none').onclick=function(){document.querySelectorAll('.blk').forEach(function(c){c.checked=false});selB()};
 document.querySelectorAll('.st button').forEach(function(b){b.onclick=function(){var k=b.dataset.k,t=b.dataset.t,w=tw(k);w[t]=Math.max(0,Math.min(20,w[t]+ +b.dataset.d));
  if(!Object.keys(w).some(function(x){return w[x]>0}))return;S.types[k]=w;saveSet();document.getElementById('tv'+k+t).textContent=w[t];upd()}});
 document.querySelectorAll('[data-rk]').forEach(function(b){b.onclick=function(){var k=b.dataset.rk;delete S.types[k];saveSet();Object.keys(tw(k)).forEach(function(t){document.getElementById('tv'+k+t).textContent=tw(k)[t]});upd()}});
}
function info(){VIEW='info';tgBack(home);
 var n=DATA.tasks.length;
 var h='<button class="lnk" id="bk">← Назад</button><h1 style="margin-top:6px">Как это работает</h1><div class="inf">'+
 '<h3>Тест</h3><p>«Старт» запускает тест по блокам, выбранным в настройках. Задания из всех блоков перемешаны. Сложность задаёт число заданий на каждый блок: Легко 5, Средне 10, Сложно 15.</p>'+
 '<p>Внутри блока задания делятся по типам в пропорциях из настроек (раскройте «Типы заданий» под блоком). Из банка сначала берутся задания, которые попадались вам реже всего, поэтому повторы начинаются только после того, как пройдены все задания нужного типа.</p>'+
 '<p>Незаконченный тест сохраняется: его можно продолжить с главной. «Отменить тест» сбрасывает его без сохранения результата.</p>'+
 '<h3>Откуда задания</h3><p>Все задания — из готового банка: '+n+' заданий, около 100 на каждый блок, в блоке M — фиксированный список глаголов с предлогами из учебника ('+DATA.tasks.filter(function(t){return t.block=='M'}).length+').</p>'+
 '<h3>Проверка и баллы</h3><p>Верно — 1 балл, почти верно — 0,5, неверно — 0. Регистр и знаки препинания не учитываются, кроме блока K «Правописание».</p>'+
 '<p>Выбор ответа, вставка слова и составление предложения проверяются по эталону сразу. Перевод, исправление и преобразование: при точном совпадении — сразу; иначе вы сравниваете свой ответ с эталоном сами и выбираете «Верно», «Почти» или «Неверно».</p>'+
 '<p>«Показать результат в конце» скрывает оценку после каждого ответа; итог и разбор ошибок всегда показываются в конце теста.</p>'+
 '<h3>Ошибки и прогресс</h3><p>«Где больше ошибок» показывает процент баллов по каждому блоку за последние 3 прохождения. Блок ниже 70% считается слабым.</p>'+
 '<p>«Работа над ошибками» собирает тест из заданий, где вы ошиблись, сначала в слабых блоках, и добирает задания из этих же блоков. Задание уходит из списка ошибок, когда вы ответите на него верно.</p>'+
 '<h3>Прочее</h3><p>Кнопки ä ö ü ß под полем ввода включаются в настройках. Настройки и прогресс сохраняются автоматически в облаке Telegram (Cloud Storage), на этом же аккаунте они доступны с любого устройства.</p>'+
 '<p class="mut">Описание обновлено: 15.11.2026.</p></div><button class="pri" id="bk2">Понятно</button>';
 app.innerHTML=h;window.scrollTo(0,0);document.getElementById('bk').onclick=home;document.getElementById('bk2').onclick=home;
}
function cntB(k){return Math.min(S.diff,bank(k).length)}
function total(){var n=0;S.blocks.forEach(function(k){n+=cntB(k)});return n}
function upd(){var sm=document.getElementById('sm');if(!sm)return;sm.textContent='Грамматические блоки: выбрано '+S.blocks.length+' из '+Object.keys(DATA.blocks).length;
 Object.keys(DATA.blocks).forEach(function(k){var e=document.getElementById('ts'+k);if(!e)return;var p=plan(k,S.diff),w=tw(k);
  e.textContent='Типы заданий: '+Object.keys(w).filter(function(t){return w[t]>0}).map(function(t){return TSH[t]+' '+(p[t]||0)}).join(', ')+' · в банке: '+bank(k).length});
 document.getElementById('cnt').textContent='Всего в тесте: '+total()+' заданий.'}
function start(){
 var pool=[],skip={},warn=[];
 S.blocks.forEach(function(k){var n=S.diff,bk=bank(k),p=plan(k,n),got=[];
  Object.keys(p).forEach(function(t){got=got.concat(pick(bk.filter(function(x){return x.type==t}),p[t],skip))});
  got=got.concat(pick(bk,Math.min(n,bk.length)-got.length,skip));
  if(got.length<Math.min(n,bk.length))warn.push('Блок '+k+': в банке меньше заданий, чем нужно.');
  pool=pool.concat(got)});
 if(!pool.length){home();document.getElementById('wmsg').textContent=warn.join(' ')||'Для выбранных блоков нет заданий. Выберите блоки в настройках.';return}
 run={q:shuffle(pool),i:0,res:[],warn:warn.join(' ')};save();show();
}
function score(){return run.res.reduce(function(a,r){return a+r.s},0)}
function buildInit(t){
 var toks=shuffle(t.text.split(' / ').map(function(w,i){return{w:w.trim(),i:i}})),placed=[];
 function draw(){
  var bl=document.getElementById('bl'),bp=document.getElementById('bp');if(!bl)return;
  bl.innerHTML=placed.length?'':'<span class="mut">Ваше предложение</span>';
  placed.forEach(function(k){var b=document.createElement('button');b.className='chip on';b.textContent=k.w;b.onclick=function(){if(bl.dataset.lock)return;placed.splice(placed.indexOf(k),1);draw()};bl.appendChild(b)});
  bp.innerHTML='';
  toks.forEach(function(k){var b=document.createElement('button');b.className='chip';b.textContent=k.w;if(placed.indexOf(k)>=0){b.disabled=true;b.style.opacity='.35'}b.onclick=function(){if(bl.dataset.lock)return;placed.push(k);draw();document.getElementById('be').textContent=''};bp.appendChild(b)})}
 draw();
 document.getElementById('rs').onclick=function(){if(document.getElementById('bl').dataset.lock)return;placed=[];draw()};
 document.getElementById('chk').onclick=function(){if(placed.length<toks.length){document.getElementById('be').textContent='Используйте все слова.';return}
  document.getElementById('bl').dataset.lock=1;document.getElementById('rs').disabled=true;answer(placed.map(function(k){return k.w}).join(' '))}}
function bindCancel(){var w=document.getElementById('cxw');
 function ask(){w.innerHTML='<div class="cx"><span>Отменить тест? Результат не сохранится.</span><button id="cxy">Да</button><button id="cxn">Нет</button></div>';
  document.getElementById('cxy').onclick=function(){run=null;saved=null;save();home()};
  document.getElementById('cxn').onclick=function(){w.innerHTML='<button class="lnk" id="cx">Отменить тест</button>';document.getElementById('cx').onclick=ask}}
 document.getElementById('cx').onclick=ask}
function umRow(){return UM?'<div class="um">'+['ä','ö','ü','ß'].map(function(c){return '<button type="button" data-c="'+c+'">'+c+'</button>'}).join('')+'</div>':''}
function umBind(el){document.querySelectorAll('.um button').forEach(function(b){b.onmousedown=function(e){e.preventDefault()};b.onclick=function(){var c=b.dataset.c,a=el.selectionStart,z=el.selectionEnd;el.value=el.value.slice(0,a)+c+el.value.slice(z);el.focus();el.selectionStart=el.selectionEnd=a+1}})}
function show(){VIEW='quiz';
 var t=run.q[run.i];
 var h='<div id="cxw" style="text-align:right;margin-bottom:4px"><button class="lnk" id="cx">Отменить тест</button></div><div class="top"><span>Вопрос '+(run.i+1)+' из '+run.q.length+'</span><span>'+(S.defer?'':'Баллы: '+fmt(score()))+'</span></div><div class="bar"><i style="width:'+(run.i/run.q.length*100)+'%"></i></div>';
 h+='<div class="blk">Блок '+t.block+' · '+esc(DATA.blocks[t.block].name)+'</div><div class="tag">'+TYPE[t.type]+'</div>'+(run.warn&&run.i==0?'<div class="note" style="margin:0 0 10px">'+esc(run.warn)+'</div>':'')+'<div class="q">'+esc(t.prompt)+(t.type=='choice'||t.type=='fill'?'\n'+esc(t.text):'')+'</div>';
 if(t.note)h+='<div class="note">Часть речи: '+esc(t.note)+'</div>';
 if(t.type=='choice'){shuffle(t.options).forEach(function(o){h+='<button class="opt" data-v="'+esc(o)+'">'+esc(o)+'</button>'})}
 else if(t.type=='fill'){h+='<input type="text" id="in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Ваш ответ">'+umRow()+'<button class="pri" id="chk">Проверить</button>'}
 else if(t.type=='build'){h+='<div class="note" style="margin-top:-6px">Нажимайте слова по порядку, чтобы собрать предложение. Нажмите на слово в строке, чтобы убрать его.</div><div id="bl" class="bl"></div><div id="bp" class="bp"></div><div class="rw"><button id="rs">Сбросить</button></div><div id="be" class="mut" style="color:var(--bad);min-height:18px"></div><button class="pri" id="chk">Проверить</button>'}
 else{
  if(t.type!='fix')h+='<div class="q" style="font-size:16px;color:var(--tx2)">'+esc(t.text)+'</div>';
  h+='<textarea id="in" rows="3" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Ваш ответ">'+(t.type=='fix'?esc(t.text):'')+'</textarea>'+umRow()+'<button class="pri" id="chk">Проверить</button>'}
 h+='<div id="fb"></div>';app.innerHTML=h;
 bindCancel();
 tgBack(function(){var c=document.getElementById('cx');if(c)c.click()});
 if(t.type=='choice')document.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){answer(b.dataset.v,b)}});
 else if(t.type=='build'){buildInit(t)}
 else{var el=document.getElementById('in');el.focus();umBind(el);document.getElementById('chk').onclick=function(){var v=el.value.trim();if(!v){el.style.borderColor='var(--bad)';return}answer(v)};
  if(t.type=='fill')el.onkeydown=function(e){if(e.key=='Enter')document.getElementById('chk').click()}}
}
function grade(t,v){
 var st=DATA.blocks[t.block].strict,sq=function(x){return x.trim().replace(/\s+/g,' ')};var exact=t.answers.some(function(a){return st?sq(a)==sq(v):norm(a)==norm(v)});
 if(exact)return{s:1,c:''};
 if(!FREE[t.type])return{s:0,c:''};
 return{s:0,c:'',self:1};
}
function answer(v,btn){
 haptic();
 var t=run.q[run.i];
 if(btn){document.querySelectorAll('.opt').forEach(function(b){b.disabled=true})}else{document.getElementById('chk').disabled=true;var inp=document.getElementById('in');if(inp)inp.disabled=true}
 var g=grade(t,v);var rec={t:t,v:v,s:g.s,c:g.c};run.res.push(rec);run.i++;var last=run.i>=run.q.length;save();run.i--;
 if(g.self){selfAsk(t,v,rec,last);return}
 if(S.defer){next();return}
 if(t.type=='choice'){document.querySelectorAll('.opt').forEach(function(b){if(norm(b.dataset.v)==norm(t.answers[0]))b.classList.add('ok');else if(b===btn&&g.s==0)b.classList.add('bad')})}
 else{document.getElementById('chk').style.display='none'}
 var cls=g.s==1?'ok':g.s==0.5?'half':'bad';
 var f='<div class="fb '+cls+'"><b>'+(g.s==1?'Верно.':g.s==0.5?'Почти: полбалла.':'Неверно.')+'</b>';
 if(g.s<1)f+=' Эталон: '+esc(t.answers[0]);
 if(g.c)f+='<div class="h">'+esc(g.c)+'</div>';
 f+='<div class="h">'+esc(t.hint)+'</div>';
 f+='</div><button class="pri" id="nx">'+(last?'Результат':'Дальше')+'</button>';
 document.getElementById('fb').innerHTML=f;
 document.getElementById('nx').onclick=next;
}
function selfAsk(t,v,rec,last){document.getElementById('chk').style.display='none';
 var f='<div class="fb half" id="sfb"><b>Сравните с эталоном.</b><div class="h">Ваш ответ: '+esc(v)+'</div><div class="h">Эталон: '+t.answers.map(esc).join('<br>или: ')+'</div><div class="sa"><button data-s="1">Верно</button><button data-s="0.5">Почти</button><button data-s="0">Неверно</button></div></div>';
 document.getElementById('fb').innerHTML=f;
 document.querySelectorAll('.sa button').forEach(function(b){b.onclick=function(){haptic();rec.s=+b.dataset.s;run.i++;save();run.i--;
  if(S.defer){next();return}
  var x=document.getElementById('sfb');x.className='fb '+(rec.s==1?'ok':rec.s==0.5?'half':'bad');
  x.innerHTML='<b>'+(rec.s==1?'Засчитано.':rec.s==0.5?'Полбалла.':'Не засчитано.')+'</b> Эталон: '+esc(t.answers[0])+'<div class="h">'+esc(t.hint)+'</div>';
  var nb=document.createElement('button');nb.className='pri';nb.textContent=last?'Результат':'Дальше';nb.onclick=next;document.getElementById('fb').appendChild(nb)}})}
function next(){run.i++;if(run.i<run.q.length){save();show()}else finish()}
function finish(){VIEW='result';tgBack(home);
 recordProgress();var sc=score(),h='<small>Результат</small><div class="big">'+fmt(sc)+' из '+run.res.length+'</div><small>По блокам</small>';
 Object.keys(DATA.blocks).forEach(function(k){var r=run.res.filter(function(x){return x.t.block==k});if(r.length)h+='<div class="row"><span>'+k+' '+DATA.blocks[k].name+'</span><span>'+fmt(r.reduce(function(a,x){return a+x.s},0))+' из '+r.length+'</span></div>'});
 var bad=run.res.filter(function(r){return r.s<1});
 if(bad.length){h+='<p><small>Разбор ошибок ('+bad.length+')</small></p>';bad.forEach(function(r){h+='<div class="err"><div class="mut">'+TYPE[r.t.type]+' · блок '+r.t.block+' · '+fmt(r.s)+(r.s==0?' баллов':' балла')+'</div>'+esc(r.t.prompt)+' '+esc(r.t.text)+'<br>Ваш ответ: '+esc(r.v)+'<br>Эталон: '+esc(r.t.answers[0])+(r.c?'<div class="mut" style="margin-top:4px">'+esc(r.c)+'</div>':'')+'<div class="mut" style="margin-top:4px">'+esc(r.t.hint)+'</div></div>'})}
 else h+='<p>Ошибок нет.</p>';
 var hasW=weak().length||errTasks().length;h+=(hasW?'<button class="pri" id="wk2">Работа над ошибками</button>':'')+'<button class="'+(hasW?'sec':'pri')+'" id="again">Пройти ещё раз</button><button class="sec" id="home">На главную</button>';
 app.innerHTML=h;run.done=true;var keep=run;run=null;saved=null;save();run=keep;
 document.getElementById('again').onclick=start;var w2=document.getElementById('wk2');if(w2)w2.onclick=startWeak;document.getElementById('home').onclick=function(){run=null;home()};
}
app.innerHTML='<p class="mut">Загрузка…</p>';
fetch('data/tasks.json').then(function(r){return r.json()}).then(function(data){
 DATA=data;
 DATA.tasks.forEach(function(t){byId[t.id]=t});
 S={diff:10,defer:false,blocks:Object.keys(DATA.blocks),types:{}};
 loadAll(init);
}).catch(function(){app.innerHTML='<p class="mut">Не удалось загрузить задания. Проверьте подключение и обновите страницу.</p>'});
</script></body></html>
